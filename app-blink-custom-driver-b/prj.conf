# Needed to control the internal RGB LED of the Espressif ESP32s3-WROOM-1-N8R2 on GPIO38
CONFIG_SENSOR=y
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_SENSOR_OUR_DRIVER=y

# Enable serial driver and console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y

# Route console output to UART
CONFIG_UART_CONSOLE=y

# (Optional but recommended) Explicitly enable printk
CONFIG_PRINTK=y